<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Mangás</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #00e676;
    }
    #status {
      text-align: center;
      font-size: 1.1rem;
      margin-bottom: 20px;
      color: #aaa;
    }
    .grid-mangas {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background-color: #1e1e1e;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .card img {
      width: 100%;
      height: 230px;
      object-fit: cover;
    }
    .card-info {
      padding: 10px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .card-title {
      font-size: 0.95rem;
      font-weight: bold;
      margin-bottom: 6px;
      line-height: 1.2;
    }
    .card-type {
      font-size: 0.75rem;
      color: #00e676;
      text-transform: uppercase;
      font-weight: bold;
      margin-top: auto;
    }
  </style>
</head>
<body>

  <h1>Meus Mangás</h1>
  <p id="status">A carregar mangás...</p>
  
  <div id="grid-mangas" class="grid-mangas"></div>

  <script>
    async function carregarMangas() {
      const url = 'https://mangaverse-api.p.rapidapi.com/manga/fetch?page=1&nsfw=false';
      const statusElement = document.getElementById('status');
      const gridElement = document.getElementById('grid-mangas');

      const options = {
        method: 'GET',
        headers: {
          'x-rapidapi-key': '2f9e110f61msh96d638614334dc0p185004jsn4d83c1e14f79', // Sua chave[span_0](start_span)[span_0](end_span)
          'x-rapidapi-host': 'mangaverse-api.p.rapidapi.com'
        }
      };

      try {
        const response = await fetch(url, options);
        const result = await response.json();

        // Limpa o texto de carregamento
        statusElement.innerText = '';

        // Pega a lista de dados retornada pela API
        const mangas = result.data || result;

        if (!mangas || mangas.length === 0) {
          statusElement.innerText = 'Nenhum mangá encontrado.';
          return;
        }

        // Renderiza cada mangá em tela
        mangas.forEach(manga => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <img src="${manga.thumb || 'https://via.placeholder.com/160x230?text=Sem+Capa'}" alt="${manga.title}">
            <div class="card-info">
              <div class="card-title">${manga.title}</div>
              <div class="card-type">${manga.type || 'Manga'}</div>
            </div>
          `;
          gridElement.appendChild(card);
        });

      } catch (error) {
        console.error('Erro na API:', error);
        statusElement.innerText = 'Erro ao carregar os dados da API.';
      }
    }

    // Executa ao abrir a página
    carregarMangas();
  </script>
</body>
</html>
