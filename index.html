<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Mangás</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #00e676;
    }
    #status {
      text-align: center;
      font-size: 1rem;
      margin-bottom: 20px;
      color: #aaa;
    }
    .grid-mangas {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background-color: #1e1e1e;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 14px rgba(0,230,118,0.3);
    }
    .card img {
      width: 100%;
      height: 230px;
      object-fit: cover;
    }
    .card-info {
      padding: 10px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .card-title {
      font-size: 0.95rem;
      font-weight: bold;
      margin-bottom: 6px;
      line-height: 1.2;
    }
    .card-type {
      font-size: 0.75rem;
      color: #00e676;
      text-transform: uppercase;
      font-weight: bold;
      margin-top: auto;
    }
  </style>
</head>
<body>

  <h1>Meus Mangás</h1>
  <p id="status">A carregar mangás...</p>
  
  <div id="grid-mangas" class="grid-mangas"></div>

  <script>
    async function carregarMangas() {
      const url = 'https://mangaverse-api.p.rapidapi.com/manga/fetch?page=1&type=all&nsfw=false';
      const statusElement = document.getElementById('status');
      const gridElement = document.getElementById('grid-mangas');

      const options = {
        method: 'GET',
        headers: {
          'x-rapidapi-key': '2f9e110f61msh96d638614334dc0p185004jsn4d83c1e14f79',
          'x-rapidapi-host': 'mangaverse-api.p.rapidapi.com'
        }
      };

      try {
        const response = await fetch(url, options);

        if (!response.ok) {
          throw new Error(`Erro na requisição: Status ${response.status}`);
        }

        const result = await response.json();
        
        let mangas = [];
        if (Array.isArray(result)) {
          mangas = result;
        } else if (result.data && Array.isArray(result.data)) {
          mangas = result.data;
        } else if (result.data && result.data.mangas) {
          mangas = result.data.mangas;
        }

        if (mangas.length === 0) {
          statusElement.innerText = 'Nenhum mangá encontrado.';
          return;
        }

        statusElement.innerText = ''; 

        mangas.forEach(manga => {
          // Cria o cartão como um link (<a>)
          const card = document.createElement('a');
          card.className = 'card';
          
          // Define a URL de destino (link do mangá ou busca no Google/fonte caso não haja URL direta)
          const linkManga = manga.link || manga.url || `https://www.google.com/search?q=${encodeURIComponent(manga.title || manga.name)}`;
          card.href = linkManga;
          card.target = '_blank'; // Abre numa nova aba

          const titulo = manga.title || manga.name || 'Sem título';
          const imagem = manga.thumb || manga.cover || manga.image || 'https://via.placeholder.com/160x230?text=Sem+Capa';
          const tipo = manga.type || 'Manga';

          card.innerHTML = `
            <img src="${imagem}" alt="${titulo}" onerror="this.src='https://via.placeholder.com/160x230?text=Sem+Capa'">
            <div class="card-info">
              <div class="card-title">${titulo}</div>
              <div class="card-type">${tipo}</div>
            </div>
          `;
          gridElement.appendChild(card);
        });

      } catch (error) {
        console.error('Erro:', error);
        statusElement.style.color = '#ff5252';
        statusElement.innerText = error.message;
      }
    }

    carregarMangas();
  </script>
</body>
</html>
