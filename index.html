<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rede Stories</title>
  
  <!-- Firebase SDKs (Compat Versão para Ficheiro Único) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #121212;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header {
      width: 100%;
      padding: 15px;
      text-align: center;
      background-color: #1e1e1e;
      border-bottom: 1px solid #333;
    }

    .stories-container {
      display: flex;
      gap: 15px;
      padding: 15px;
      width: 100%;
      max-width: 500px;
      overflow-x: auto;
      background-color: #1e1e1e;
      border-bottom: 1px solid #333;
    }

    .story-circle {
      min-width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 3px solid #e1306c;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      background-size: cover;
      background-position: center;
    }

    .add-story {
      border: 2px dashed #888;
      background-color: #2a2a2a;
    }

    .add-story span {
      font-size: 24px;
      color: #fff;
    }

    .story-item p {
      font-size: 11px;
      text-align: center;
      margin-top: 5px;
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
      width: 70px;
    }

    /* Modal de Envio */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .modal-content {
      background: #222;
      padding: 20px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 90%;
      max-width: 350px;
    }

    .modal-content input {
      padding: 10px;
      border-radius: 5px;
      border: none;
    }

    .modal-actions {
      display: flex;
      justify-content: space-between;
    }

    .modal-actions button {
      padding: 8px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    #btn-upload { background: #e1306c; color: white; }
    #btn-cancel { background: #555; color: white; }

    /* Visualizador de Story em Tela Cheia */
    .story-viewer {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #000;
      z-index: 100;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .story-viewer img {
      max-width: 100%;
      max-height: 80vh;
      object-fit: contain;
    }

    .close-viewer {
      position: absolute;
      top: 15px; right: 20px;
      font-size: 30px;
      cursor: pointer;
      z-index: 101;
    }

    .viewer-header {
      position: absolute;
      top: 25px; left: 20px;
      font-size: 16px;
      z-index: 101;
    }

    .progress-bar {
      position: absolute;
      top: 10px; left: 10px; right: 10px;
      height: 3px;
      background: rgba(255,255,255,0.3);
    }

    .progress {
      width: 0%;
      height: 100%;
      background: #fff;
      transition: width 0.1s linear;
    }
  </style>
</head>
<body>

  <header class="header">
    <h1>Rede Stories</h1>
  </header>

  <!-- Barra de Stories -->
  <div class="stories-container">
    <div class="story-circle add-story" id="btn-open-modal">
      <span>+</span>
      <p>Novo</p>
    </div>
    <div id="stories-list" style="display: flex; gap: 15px;"></div>
  </div>

  <!-- Modal para Criar Story -->
  <div class="modal" id="modal-add">
    <div class="modal-content">
      <h3>Criar Novo Story</h3>
      <input type="text" id="username-input" placeholder="Seu Nome/Usuário" required>
      <input type="file" id="image-input" accept="image/*" required>
      <div class="modal-actions">
        <button id="btn-cancel">Cancelar</button>
        <button id="btn-upload">Postar Story</button>
      </div>
    </div>
  </div>

  <!-- Visualizador de Story -->
  <div class="story-viewer" id="story-viewer">
    <div class="progress-bar"><div class="progress" id="progress-line"></div></div>
    <span class="close-viewer" id="close-viewer">&times;</span>
    <div class="viewer-header">
      <strong id="viewer-username">Usuário</strong>
    </div>
    <img id="viewer-img" src="" alt="Story">
  </div>

  <script>
    // As tuas chaves de configuração do Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyD_UAgEl768R3DaDGTxsGjE2nJOJAmO_N8",
      authDomain: "stories-5bc7c.firebaseapp.com",
      projectId: "stories-5bc7c",
      storageBucket: "stories-5bc7c.firebasestorage.app",
      messagingSenderId: "13370075903",
      appId: "1:13370075903:web:f76554bd014a9f9ca13aca",
      measurementId: "G-Z91PJL1MWG"
    };

    // Inicialização do Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const storage = firebase.storage();

    // Elementos do DOM
    const btnOpenModal = document.getElementById('btn-open-modal');
    const btnCancel = document.getElementById('btn-cancel');
    const btnUpload = document.getElementById('btn-upload');
    const modalAdd = document.getElementById('modal-add');
    const storiesList = document.getElementById('stories-list');

    const storyViewer = document.getElementById('story-viewer');
    const closeViewer = document.getElementById('close-viewer');
    const viewerImg = document.getElementById('viewer-img');
    const viewerUsername = document.getElementById('viewer-username');
    const progressLine = document.getElementById('progress-line');

    // Modais
    btnOpenModal.onclick = () => modalAdd.style.display = 'flex';
    btnCancel.onclick = () => modalAdd.style.display = 'none';

    // Enviar Novo Story
    btnUpload.onclick = async () => {
      const username = document.getElementById('username-input').value;
      const file = document.getElementById('image-input').files[0];

      if (!username || !file) {
        alert("Preenche o teu nome e escolhe uma imagem!");
        return;
      }

      btnUpload.innerText = "A enviar...";
      btnUpload.disabled = true;

      try {
        const storageRef = storage.ref(`stories/${Date.now()}_${file.name}`);
        await storageRef.put(file);
        const imageUrl = await storageRef.getDownloadURL();

        await db.collection('stories').add({
          username: username,
          imageUrl: imageUrl,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        modalAdd.style.display = 'none';
        document.getElementById('username-input').value = '';
        document.getElementById('image-input').value = '';
      } catch (error) {
        console.error("Erro:", error);
        alert("Erro ao publicar o story. Verifica as permissões do Firebase.");
      } finally {
        btnUpload.innerText = "Postar Story";
        btnUpload.disabled = false;
      }
    };

    // Carregar Stories em Tempo Real
    db.collection('stories')
      .orderBy('createdAt', 'desc')
      .onSnapshot(snapshot => {
        storiesList.innerHTML = '';
        snapshot.docs.forEach(doc => {
          const data = doc.data();
          if (data.imageUrl) {
            const item = document.createElement('div');
            item.className = 'story-item';
            item.innerHTML = `
              <div class="story-circle" style="background-image: url('${data.imageUrl}')"></div>
              <p>${data.username}</p>
            `;
            item.onclick = () => openStory(data);
            storiesList.appendChild(item);
          }
        });
      });

    // Visualização do Story
    let timer = null;
    function openStory(data) {
      storyViewer.style.display = 'flex';
      viewerImg.src = data.imageUrl;
      viewerUsername.innerText = data.username;
      progressLine.style.width = '0%';

      let width = 0;
      clearInterval(timer);
      timer = setInterval(() => {
        if (width >= 100) {
          clearInterval(timer);
          closeStory();
        } else {
          width += 2;
          progressLine.style.width = width + '%';
        }
      }, 100);
    }

    function closeStory() {
      clearInterval(timer);
      storyViewer.style.display = 'none';
    }

    closeViewer.onclick = closeStory;
  </script>
</body>
</html>
